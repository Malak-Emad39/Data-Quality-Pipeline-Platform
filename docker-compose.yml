services:
  postgres:
    image: postgres:15-alpine
    container_name: dq_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_dq}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ecommerce_dq"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dq_network

  adminer:
    image: adminer:latest
    container_name: dq_adminer
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 128m
    networks:
      - dq_network

  minio:
    image: bitnamilegacy/minio:latest
    container_name: dq_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_API_PORT_NUMBER: 9000
      MINIO_CONSOLE_PORT_NUMBER: 9001
      MINIO_BROWSER: "on"
      MINIO_DEFAULT_BUCKETS: "bronze,silver,gold,rejected"
    volumes:
      - minio_data:/bitnami/minio/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dq_network

  spark-master:
    image: bitnamilegacy/spark:3.5.1
    container_name: dq_spark_master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
    mem_limit: 1g
    networks:
      - dq_network

  spark-worker:
    image: bitnamilegacy/spark:3.5.1
    container_name: dq_spark_worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    depends_on:
      - spark-master
    mem_limit: 1536m
    networks:
      - dq_network

  airflow:
    image: apache/airflow:2.9.3-python3.11
    container_name: dq_airflow
    command: standalone
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:admin@postgres:5432/ecommerce_dq
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__WEB_SERVER_PORT=8080
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1536m
    networks:
      - dq_network

volumes:
  postgres_data:
  minio_data:

networks:
  dq_network:
    driver: bridge